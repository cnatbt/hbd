<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تولدت مبارک مریم جان</title>
    <!-- Import Vazirmatn Font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slideshow-container">
        
        <!-- Slide 1: Welcome -->
        <div class="slide active">
            <div class="content">
                <h1 class="animate-text">تولدت مبارک مریم جان! 🎂</h1>
                <p class="animate-text delay-1">امیدوارم سال جدید زندگیت پر از شادی و موفقیت باشه.</p>
            </div>
        </div>

        <!-- Slide 2: The Picture -->
        <div class="slide">
            <div class="content image-slide">
                <img src="https://i.ibb.co/Ld5QyqZ/maryam.jpg" alt="Maryam" class="profile-pic animate-image">
                <h2 class="animate-text delay-1">زیباترین دختر فامیل ✨</h2>
            </div>
        </div>

        <!-- Slide 3: Wishes -->
        <div class="slide">
            <div class="content">
                <h1 class="animate-text">بهترین آرزوها برای تو 💖</h1>
                <p class="animate-text delay-1">همیشه لبخند روی لبت باشه و زندگیت پر از لحظه‌های قشنگ.</p>
            </div>
        </div>

    </div>

    <!-- Navigation Dots -->
    <div class="dots-container">
        <span class="dot active" onclick="currentSlide(0)"></span>
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
